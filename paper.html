<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>근로계약서 협상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#12172a; --ink-navy-deep:#0b0f1c; --parchment:#f1ead8; --ink-text:#211c14;
    --gold:#c8a133; --gold-bright:#e6c25c;
    --manager-color:#8a3636; --manager-dark:#652525;
    --worker-color:#2f6f6b; --worker-dark:#1f4d49;
    --line:rgba(200,161,51,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #1c2340 0%, var(--ink-navy) 45%, var(--ink-navy-deep) 100%);
    color:var(--parchment); font-family:'Gowun Batang', serif; min-height:100vh;
    padding:28px 16px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{ text-align:center; letter-spacing:0.35em; font-size:11px; color:var(--gold-bright); font-family:-apple-system, sans-serif; margin-bottom:10px; opacity:0.85;}
  h1{ font-family:'Noto Serif KR', serif; font-weight:900; font-size:24px; line-height:1.35; text-align:center; margin:0 0 6px;}
  .subtitle{ text-align:center; font-size:13px; color:var(--gold-bright); opacity:0.75; margin-bottom:22px;}
  .divider{ width:64px;height:2px;margin:0 auto 22px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}

  .card{ background:var(--parchment); color:var(--ink-text); border-radius:4px; padding:20px 18px; margin-bottom:14px;
    box-shadow:0 12px 26px rgba(0,0,0,0.32); border:1px solid rgba(0,0,0,0.06);}
  .card-label{ font-family:-apple-system, sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--manager-dark); opacity:0.55; margin-bottom:10px; font-weight:600;}

  label{ display:block; font-family:-apple-system, sans-serif; font-size:12.5px; color:var(--gold-bright); margin-bottom:6px; opacity:0.85;}
  select, input[type=text], input[type=number], textarea{
    width:100%; background:var(--parchment); color:var(--ink-text); border:1px solid rgba(0,0,0,0.15);
    border-radius:4px; padding:11px 12px; font-family:-apple-system, sans-serif; font-size:14px; margin-bottom:14px;
  }
  textarea{ min-height:70px; resize:vertical; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  .story-box{
    background:var(--ink-navy); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:14px;
    font-family:'Gowun Batang', serif; font-size:14px; line-height:1.7; color:var(--parchment);
  }
  .story-box .tip{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    font-family:-apple-system, sans-serif; font-size:12.5px; line-height:1.6; color:var(--gold-bright);
  }

  .info-card{
    border-radius:4px; padding:16px; margin-bottom:14px; font-family:-apple-system, sans-serif; font-size:12.5px; line-height:1.75;
    border-left:4px solid;
  }
  .info-card.manager{ background:rgba(138,54,54,0.12); border-left-color:var(--manager-color); color:var(--parchment);}
  .info-card.worker{ background:rgba(47,111,107,0.12); border-left-color:var(--worker-color); color:var(--parchment);}
  .info-card .info-title{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:14px; margin-bottom:8px;}
  .info-card ul{ margin:0; padding-left:18px;}
  .info-card li{ margin-bottom:6px;}

  .choice-group{ margin-bottom:14px; }
  .choice-group .glabel{ font-family:-apple-system, sans-serif; font-size:12.5px; color:var(--manager-dark); opacity:0.7; margin-bottom:8px; font-weight:600;}
  .choice-options{ display:flex; flex-wrap:wrap; gap:8px; }
  .choice-pill{
    padding:9px 14px; border-radius:20px; border:1.5px solid rgba(0,0,0,0.15); background:rgba(255,255,255,0.5);
    font-family:-apple-system, sans-serif; font-size:12.5px; cursor:pointer; color:var(--ink-text);
  }
  .choice-pill.selected{ background:var(--gold); border-color:var(--gold); color:#2a1e05; font-weight:700;}
  .choice-pill.multi.selected{ background:var(--worker-color); border-color:var(--worker-color); color:#fff;}
  .choice-pill.multi.selected::before{ content:'✓ '; }
  .explain-text{
    margin-top:8px; font-family:-apple-system, sans-serif; font-size:11.5px; line-height:1.6; color:var(--manager-dark);
    opacity:0.75; background:rgba(138,54,54,0.06); border-radius:4px; padding:8px 10px;
  }

  .calc-btn, .confirm-btn{
    width:100%; border:none; border-radius:4px; padding:15px; font-family:'Noto Serif KR', serif; font-weight:900;
    font-size:15px; cursor:pointer; margin-bottom:10px;
  }
  .calc-btn{ background:rgba(241,234,216,0.12); border:1.5px solid var(--gold-bright); color:var(--gold-bright);}
  .confirm-btn{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#2a1e05; box-shadow:0 10px 24px rgba(200,161,51,0.3);}
  .confirm-btn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none;}

  .ledger{ display:none; }
  .ledger.show{ display:block; animation:riseIn 0.4s ease both;}
  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .ledger-row{ display:flex; justify-content:space-between; font-family:-apple-system, sans-serif; font-size:13px; padding:6px 0; }
  .ledger-row.minus{ color:var(--manager-dark); }
  .ledger-row.total{ border-top:1px solid rgba(0,0,0,0.15); margin-top:6px; padding-top:10px; font-weight:700; font-size:14.5px;}
  .ledger-row.final{ border-top:2px solid var(--ink-text); margin-top:6px; padding-top:10px; font-weight:900; font-size:16px;}
  .compare-note{ margin-top:10px; font-family:-apple-system, sans-serif; font-size:12px; opacity:0.7; text-align:center;}

  .score-bar-wrap{ margin-top:16px; }
  .score-labels{ display:flex; justify-content:space-between; font-family:-apple-system, sans-serif; font-size:12px; font-weight:700; margin-bottom:6px;}
  .score-labels .m{ color:var(--manager-dark); } .score-labels .w{ color:var(--worker-dark); }
  .score-bar{ height:22px; border-radius:11px; overflow:hidden; display:flex; box-shadow:inset 0 2px 4px rgba(0,0,0,0.15);}
  .score-bar .seg-m{ background:var(--manager-color); }
  .score-bar .seg-w{ background:var(--worker-color); }

  .result-section{ display:none; }
  .result-section.show{ display:block; text-align:center; padding:20px 0;}
  .seal{
    width:96px;height:96px;border-radius:50%; margin:0 auto 16px;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6a1c 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 30px rgba(200,161,51,0.45);
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:14px; color:#2a1e05; text-align:center; line-height:1.2;
  }

  .certificate{
    background:var(--parchment); color:var(--ink-text); border-radius:6px; padding:32px 26px;
    margin:20px 0; text-align:left; border:2px solid var(--gold); position:relative;
    box-shadow:0 16px 34px rgba(0,0,0,0.35);
  }
  .certificate-header{ text-align:center; margin-bottom:20px; }
  .certificate-header .ctype{ font-family:-apple-system, sans-serif; font-size:11px; letter-spacing:0.3em; color:var(--manager-dark); opacity:0.6; margin-bottom:6px;}
  .certificate-header h2{ font-family:'Noto Serif KR', serif; font-size:22px; font-weight:900; margin:0; }
  .certificate-divider{ width:52px; height:2px; background:var(--gold); margin:14px auto 0; }
  .cert-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed rgba(0,0,0,0.12); font-family:-apple-system, sans-serif; font-size:13px; }
  .cert-row .k{ opacity:0.6; }
  .cert-row .v{ font-weight:700; text-align:right; max-width:65%; }
  .cert-seal-mini{
    position:absolute; right:22px; bottom:22px; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6a1c 100%);
    display:flex; align-items:center; justify-content:center; transform:rotate(-8deg);
    box-shadow:0 6px 14px rgba(0,0,0,0.3); font-family:'Noto Serif KR', serif; font-weight:900; font-size:10px; color:#2a1e05; text-align:center; line-height:1.2;
  }
  .cert-date{ margin-top:18px; font-family:-apple-system, sans-serif; font-size:11px; opacity:0.5; text-align:center; }

  .download-btn{
    width:100%; background:none; border:1.5px solid var(--gold-bright); color:var(--gold-bright);
    font-family:-apple-system, sans-serif; font-weight:700; font-size:14px; padding:13px; border-radius:4px; cursor:pointer;
  }
  .download-hint{ margin-top:10px; font-family:-apple-system, sans-serif; font-size:11.5px; color:var(--parchment); opacity:0.6; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">2차 회의</div>
  <h1>근로계약서 협상</h1>
  <div class="subtitle">— 조건을 조율하고, 손익을 확인하고, 계약을 맺다 —</div>
  <div class="divider"></div>

  <div id="formSection">

    <div class="card">
      <div class="card-label">Step 1 · 기본 정보</div>
      <div class="row2">
        <div><label>모둠번호</label><input type="text" id="groupNum" placeholder="예: 3"></div>
        <div><label>학번</label><input type="text" id="studentNum" placeholder="예: 10203"></div>
      </div>
      <label>이름</label>
      <input type="text" id="studentName" placeholder="이름">
      <label>담당 실무자 이름</label>
      <input type="text" id="partnerName" placeholder="함께 협상한 실무직 노동자 이름 (실무직이면 본인 이름)">
      <label>사업장</label>
      <select id="workplaceSelect"><option value="">사업장을 선택하세요</option></select>
      <label>나의 역할</label>
      <select id="roleSelect">
        <option value="">역할을 선택하세요</option>
        <option value="manager">관리직 노동자</option>
        <option value="worker">실무직 노동자</option>
      </select>
    </div>

    <div id="storyBox"></div>
    <div id="infoCardBox"></div>

    <div class="card" id="termsCard" style="display:none;">
      <div class="card-label" id="termsLabel">Step 2 · 계약 조건</div>
      <div id="termsBody"></div>
    </div>

    <button class="calc-btn" id="calcBtn" style="display:none;">🧮 계산하기</button>

    <div class="card ledger" id="ledgerCard">
      <div class="card-label" id="ledgerLabel">예상 손익 계산</div>
      <div id="ledgerBody"></div>
      <div class="score-bar-wrap">
        <div class="score-labels"><span class="m" id="scoreManagerLabel">관리직 노동자 0점</span><span class="w" id="scoreWorkerLabel">실무직 노동자 0점</span></div>
        <div class="score-bar"><div class="seg-m" id="segManager" style="width:50%;"></div><div class="seg-w" id="segWorker" style="width:50%;"></div></div>
      </div>
    </div>

    <button class="confirm-btn" id="confirmBtn" disabled>📝 근로계약서 확정</button>
  </div>

  <div class="result-section" id="resultSection">
    <div class="seal">계약<br>체결<br>완료</div>
    <div style="font-family:'Noto Serif KR', serif; font-weight:900; font-size:18px; margin-bottom:8px;">계약이 체결되었습니다</div>

    <div class="certificate" id="certificate">
      <div class="certificate-header">
        <div class="ctype" id="certType">LABOR CONTRACT</div>
        <h2 id="certTitleText">근로계약서</h2>
        <div class="certificate-divider"></div>
      </div>
      <div id="certBody"></div>
      <div class="cert-seal-mini">확인<br>인장</div>
      <div class="cert-date" id="certDate"></div>
    </div>

    <button class="download-btn" id="downloadBtn">📸 계약서 이미지로 저장하기</button>
    <div class="download-hint">캡처된 이미지가 다운로드돼요. 폰 갤러리에 저장하듯 보관하세요.</div>
  </div>

</div>

<iframe name="contract_hidden_iframe" id="contract_hidden_iframe" style="display:none;"></iframe>
<form id="contractFormBridge" method="POST" target="contract_hidden_iframe" style="display:none;"
      action="https://docs.google.com/forms/d/e/1FAIpQLScHlVp5Ob8Ry3wt8CVEtVNe0kYYnVf_ZHcJ0cXQ4QPQ4qAf1w/formResponse">
  <input type="text" name="entry.1219627582" id="cf_group">
  <input type="text" name="entry.1629980461" id="cf_workplace">
  <input type="text" name="entry.392108960" id="cf_role">
  <input type="text" name="entry.425619824" id="cf_name">
  <input type="text" name="entry.100026556" id="cf_title">
  <input type="text" name="entry.257455019" id="cf_terms">
  <input type="text" name="entry.146711589" id="cf_wage">
  <input type="text" name="entry.578845929" id="cf_cost">
  <input type="text" name="entry.1963656756" id="cf_score">
</form>

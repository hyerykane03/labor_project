<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>3차 회의: 위기가 찾아온다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink-navy:#12172a; --ink-navy-deep:#0b0f1c; --parchment:#f1ead8; --ink-text:#211c14;
    --gold:#c8a133; --gold-bright:#e6c25c;
    --manager-color:#8a3636; --manager-dark:#652525;
    --worker-color:#2f6f6b; --worker-dark:#1f4d49;
    --line:rgba(200,161,51,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #1c2340 0%, var(--ink-navy) 45%, var(--ink-navy-deep) 100%);
    color:var(--parchment); font-family:'Gowun Batang', serif; min-height:100vh;
    padding:28px 16px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{ text-align:center; letter-spacing:0.35em; font-size:14px; color:var(--gold-bright); font-family:-apple-system, sans-serif; margin-bottom:10px; opacity:0.85;}
  h1{ font-family:'Noto Serif KR', serif; font-weight:900; font-size:26px; line-height:1.35; text-align:center; margin:0 0 6px;}
  .subtitle{ text-align:center; font-size:14px; color:var(--gold-bright); opacity:0.75; margin-bottom:22px;}
  .divider{ width:64px;height:2px;margin:0 auto 22px; background:linear-gradient(90deg, transparent, var(--gold), transparent);}

  .card{ background:var(--parchment); color:var(--ink-text); border-radius:4px; padding:20px 18px; margin-bottom:14px;
    box-shadow:0 12px 26px rgba(0,0,0,0.32); border:1px solid rgba(0,0,0,0.06);}
  .card-label{ font-family:-apple-system, sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--manager-dark); opacity:0.55; margin-bottom:10px; font-weight:600;}

  label{ display:block; font-family:-apple-system, sans-serif; font-size:12.5px; color:var(--gold-bright); margin-bottom:6px; opacity:0.85;}
  input[type=text], textarea{
    width:100%; background:var(--parchment); color:var(--ink-text); border:1px solid rgba(0,0,0,0.15);
    border-radius:4px; padding:11px 12px; font-family:-apple-system, sans-serif; font-size:14px; margin-bottom:14px;
  }
  textarea{ min-height:110px; resize:vertical; line-height:1.6; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  .search-btn, .submit-btn, .download-btn, .action-btn{
    width:100%; border:none; border-radius:4px; padding:15px; font-family:'Noto Serif KR', serif; font-weight:900;
    font-size:15px; cursor:pointer; margin-bottom:10px;
  }
  .search-btn, .submit-btn{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#2a1e05; box-shadow:0 10px 24px rgba(200,161,51,0.3);}
  .download-btn{ background:none; border:1.5px solid var(--gold-bright); color:var(--gold-bright); font-family:-apple-system, sans-serif; font-weight:700; font-size:14px;}
  .action-btn{ background:rgba(241,234,216,0.12); border:1.5px solid var(--gold-bright); color:var(--gold-bright); font-family:-apple-system, sans-serif; font-size:13px; padding:12px;}

  .story-box{
    background:var(--ink-navy); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:14px;
    font-family:'Gowun Batang', serif; font-size:15px; line-height:1.75; color:var(--parchment);
  }
  .info-badge{
    display:inline-block; font-family:-apple-system, sans-serif; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; margin-right:6px; margin-bottom:6px;
  }
  .badge-worker{ background:var(--worker-color); color:#fff; }
  .badge-manager{ background:var(--manager-color); color:#fff; }

  .compare-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .compare-box{ border-radius:4px; padding:14px; font-family:-apple-system, sans-serif; font-size:12.5px; line-height:1.7; }
  .compare-box.good{ background:rgba(47,111,107,0.12); border-left:4px solid var(--worker-color); }
  .compare-box.bad{ background:rgba(138,54,54,0.12); border-left:4px solid var(--manager-color); }
  .compare-box .t{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:13.5px; margin-bottom:6px; }

  .terms-list{ font-family:-apple-system, sans-serif; font-size:13px; line-height:2; }
  .terms-list span{ display:inline-block; background:rgba(0,0,0,0.05); border-radius:4px; padding:3px 9px; margin:0 4px 4px 0; }

  .compare-table{ width:100%; border-collapse:collapse; font-family:-apple-system, sans-serif; font-size:12.5px; }
  .compare-table th{ text-align:left; padding:8px 6px; font-size:11px; letter-spacing:0.05em; color:var(--manager-dark); opacity:0.7; border-bottom:2px solid rgba(0,0,0,0.15); }
  .compare-table td{ padding:9px 6px; border-bottom:1px solid rgba(0,0,0,0.08); vertical-align:top; }
  .compare-table tr.mismatch td{ background:rgba(138,54,54,0.1); }
  .compare-table tr.mismatch td:first-child{ font-weight:700; color:var(--manager-dark); }
  .compare-table tr.mismatch td:first-child::before{ content:'⚠️ '; }
  .compare-table td:first-child{ font-weight:600; white-space:nowrap; opacity:0.75; }

  .explain-text{
    font-family:-apple-system, sans-serif; font-size:11.5px; line-height:1.6; color:var(--manager-dark);
    opacity:0.85; background:rgba(138,54,54,0.08); border-radius:4px; padding:9px 11px;
  }

  .info-card{
    border-radius:4px; padding:15px; margin-bottom:14px; font-family:-apple-system, sans-serif; font-size:12.5px; line-height:1.7;
    border-left:4px solid var(--worker-color); background:rgba(47,111,107,0.1); color:var(--ink-text);
  }
  .info-card .info-title{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:13.5px; margin-bottom:8px; color:var(--worker-dark); }
  .info-card ul{ margin:0; padding-left:18px; }
  .info-card li{ margin-bottom:7px; }

  .choice-group{ margin-bottom:14px; }
  .choice-group .glabel{ font-family:-apple-system, sans-serif; font-size:12.5px; color:var(--manager-dark); opacity:0.7; margin-bottom:8px; font-weight:600;}
  .choice-pill{
    padding:9px 14px; border-radius:20px; border:1.5px solid rgba(0,0,0,0.15); background:rgba(255,255,255,0.5);
    font-family:-apple-system, sans-serif; font-size:12.5px; cursor:pointer; color:var(--ink-text); margin:0 6px 6px 0;
  }
  .choice-pill.selected{ background:var(--worker-color); border-color:var(--worker-color); color:#fff; font-weight:700; }
  .choice-pill.selected::before{ content:'✓ '; }

  .activity-tag{
    display:inline-block; font-family:'Noto Serif KR', serif; font-weight:900; font-size:15px;
    padding:8px 16px; border-radius:4px; margin-bottom:14px; background:var(--gold); color:#2a1e05;
  }

  .hidden{ display:none !important; }

  .certificate{
    background:var(--parchment); color:var(--ink-text); border-radius:6px; padding:30px 24px;
    margin:20px 0; text-align:left; border:2px solid var(--gold); position:relative;
    box-shadow:0 16px 34px rgba(0,0,0,0.35);
  }
  .certificate-header{ text-align:center; margin-bottom:18px; }
  .certificate-header .ctype{ font-family:-apple-system, sans-serif; font-size:11px; letter-spacing:0.3em; color:var(--manager-dark); opacity:0.6; margin-bottom:6px;}
  .certificate-header h2{ font-family:'Noto Serif KR', serif; font-size:22px; font-weight:900; margin:0; }
  .certificate-divider{ width:52px; height:2px; background:var(--gold); margin:14px auto 0; }
  .cert-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed rgba(0,0,0,0.12); font-family:-apple-system, sans-serif; font-size:12.5px; }
  .cert-row .k{ opacity:0.6; flex-shrink:0; margin-right:10px; }
  .cert-row .v{ font-weight:700; text-align:right; }
  .cert-body-text{ margin-top:14px; font-family:-apple-system, sans-serif; font-size:13px; line-height:1.8; white-space:pre-wrap; }
  .cert-date{ margin-top:18px; font-family:-apple-system, sans-serif; font-size:11px; opacity:0.5; text-align:center; }

  .error-box{ background:rgba(138,54,54,0.15); border:1px solid var(--manager-color); color:#f1c9c9;
    border-radius:4px; padding:12px 14px; font-family:-apple-system, sans-serif; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">3차 회의</div>
  <h1>위기가 찾아온다</h1>
  <div class="subtitle">— 나의 계약서는 나를 지켜줄까? —</div>
  <div class="divider"></div>

  <div id="searchSection">
    <div class="card">
      <div class="card-label">Step 1 · 본인 확인</div>
      <div class="row2">
        <div><label>학번</label><input type="text" id="numInput" placeholder="예: 20701" inputmode="numeric" maxlength="5"></div>
        <div><label>이름</label><input type="text" id="nameInput" placeholder="이름"></div>
      </div>
    </div>
    <button class="search-btn" id="searchBtn">🔍 내 시나리오 확인하기</button>
    <div class="error-box hidden" id="searchError"></div>
  </div>

  <div id="resultSection" class="hidden">

    <div class="card">
      <div class="card-label">Step 2 · 위기 상황</div>
      <div id="roleBadges"></div>
      <div class="story-box" id="scenarioBox"></div>
    </div>

    <div class="card" id="guaranteeCard">
      <div class="card-label">Step 3 · 보장 가능 / 보장 불가</div>
      <div class="compare-grid" id="guaranteeGrid"></div>
    </div>

    <div class="card">
      <div class="card-label">Step 4 · 근로계약서 대조 (나 ↔ 협상 상대)</div>
      <div id="compareNote" style="font-family:-apple-system, sans-serif; font-size:12px; opacity:0.65; margin-bottom:10px;"></div>
      <table class="compare-table" id="compareTable"></table>
    </div>

    <div class="card">
      <div class="card-label">Step 5 · 문서 작성</div>
      <div class="activity-tag" id="activityTag"></div>
      <div id="writingForm"></div>
    </div>

    <button class="submit-btn" id="submitBtn">📝 작성 완료 · 제출</button>
  </div>

  <div id="certSection" class="hidden">
    <div class="certificate" id="certificate">
      <div class="certificate-header">
        <div class="ctype" id="certType">DOCUMENT</div>
        <h2 id="certTitleText">문서</h2>
        <div class="certificate-divider"></div>
      </div>
      <div id="certMeta"></div>
      <div class="cert-body-text" id="certBodyText"></div>
      <div class="cert-date" id="certDate"></div>
    </div>
    <button class="download-btn" id="downloadBtn">📸 문서 이미지로 저장하기</button>
    <button class="action-btn" id="restartBtn">🔄 처음으로</button>
  </div>

</div>

<iframe name="crisis_hidden_iframe" id="crisis_hidden_iframe" style="display:none;"></iframe>
<form id="crisisFormBridge" method="POST" target="crisis_hidden_iframe" style="display:none;"

  <input type="text" name="entry.836023071" id="gf_activity">
  <input type="text" name="entry.639657168" id="gf_selected">
  <input type="text" name="entry.119526509" id="gf_freetext">

</form>

    searchError.classList.add('hidden');
    if(!num || !name){
      searchError.textContent = '5자리 학번(예: 20701)과 이름을 모두 입력해주세요.';
      searchError.classList.remove('hidden');
      return;
    }
    const found = STUDENTS.find(function(s){ return s.studentId === num && s.name === name; });
    if(!found){
      searchError.textContent = '일치하는 학생 정보를 찾을 수 없어요. 학번·이름을 다시 확인해주세요.';
      searchError.classList.remove('hidden');
      return;
    }
    current = found;
    renderResult(found);
  });

  function renderResult(s){
    searchSection.classList.add('hidden');
    resultSection.classList.remove('hidden');

    const badgeClass = s.role === '관리직 노동자' ? 'badge-manager' : 'badge-worker';
    document.getElementById('roleBadges').innerHTML =
      '<span class="info-badge ' + badgeClass + '">' + esc(s.company) + '</span>' +
      '<span class="info-badge ' + badgeClass + '">' + esc(s.role) + '</span>';

    document.getElementById('scenarioBox').textContent = s.scenario || '시나리오 정보가 없습니다.';

    const gGrid = document.getElementById('guaranteeGrid');
    if(!s.protected && !s.unprotected){
      document.getElementById('guaranteeCard').classList.add('hidden');
    } else {
      let html = '';
      if(s.protected){
        html += '<div class="compare-box good"><div class="t">✅ 보장 가능</div>' + esc(s.protected) + '</div>';
      }
      if(s.unprotected){
        html += '<div class="compare-box bad"><div class="t">❌ 보장 불가</div>' + esc(s.unprotected) + '</div>';
      }
      gGrid.innerHTML = html;
    }

    const compareNote = document.getElementById('compareNote');
    const compareTable = document.getElementById('compareTable');

    function parseTerms(str){
      const map = {};
      if(!str) return map;
      str.split('/').forEach(function(part){
        const idx = part.indexOf(':');
        if(idx === -1) return;
        const k = part.slice(0, idx).trim();
        const v = part.slice(idx+1).trim();
        if(k) map[k] = v;
      });
      return map;
    }

    const myLabel = s.role === '관리직 노동자' ? '나 (관리직)' : '나 (실무직)';
    const partnerLabel = s.role === '관리직 노동자' ? (s.partner || '실무직 상대') + ' (실무직)' : (s.partner || '관리직 상대') + ' (관리직)';

    if(!s.contractTerms){
      compareNote.textContent = '나의 계약 데이터가 없습니다.';
      compareTable.innerHTML = '';
    } else if(!s.partnerContractTerms){
      compareNote.textContent = '협상 상대의 계약 데이터를 찾을 수 없어 나의 계약만 표시합니다.';
      const mine = parseTerms(s.contractTerms);
      compareTable.innerHTML = '<tr><th>항목</th><th>' + esc(myLabel) + '</th></tr>' +
        Object.keys(mine).map(function(k){ return '<tr><td>'+esc(k)+'</td><td>'+esc(mine[k])+'</td></tr>'; }).join('');
    } else {
      const mine = parseTerms(s.contractTerms);
      const theirs = parseTerms(s.partnerContractTerms);
      const allKeys = Array.from(new Set(Object.keys(mine).concat(Object.keys(theirs))));
      let mismatchCount = 0;
      let rows = '<tr><th>항목</th><th>' + esc(myLabel) + '</th><th>' + esc(partnerLabel) + '</th></tr>';
      allKeys.forEach(function(k){
        const v1 = mine[k] || '(미기재)';
        const v2 = theirs[k] || '(미기재)';
        const mismatch = v1 !== v2;
        if(mismatch) mismatchCount++;
        rows += '<tr class="' + (mismatch?'mismatch':'') + '"><td>' + esc(k) + '</td><td>' + esc(v1) + '</td><td>' + esc(v2) + '</td></tr>';
      });
      compareTable.innerHTML = rows;
      compareNote.textContent = mismatchCount > 0
        ? '⚠️ 서로 다르게 기억하거나 기재한 항목이 ' + mismatchCount + '개 있어요. 빨간 줄을 확인하세요.'
        : '✅ 두 계약서 내용이 정확히 일치해요.';
    }

    currentMismatches = getMismatches(s);
    document.getElementById('activityTag').textContent = s.activityType;
    renderWritingForm(s);
  }

  let currentMismatches = [];

  function parseTermsGlobal(str){
    const map = {};
    if(!str) return map;
    str.split('/').forEach(function(part){
      const idx = part.indexOf(':');
      if(idx === -1) return;
      const k = part.slice(0, idx).trim();
      const v = part.slice(idx+1).trim();
      if(k) map[k] = v;
    });
    return map;
  }

  function getMismatches(s){
    if(!s.contractTerms || !s.partnerContractTerms) return [];
    const mine = parseTermsGlobal(s.contractTerms);
    const theirs = parseTermsGlobal(s.partnerContractTerms);
    const allKeys = Array.from(new Set(Object.keys(mine).concat(Object.keys(theirs))));
    const list = [];
    allKeys.forEach(function(k){
      const v1 = mine[k] || '(미기재)';
      const v2 = theirs[k] || '(미기재)';
      if(v1 !== v2){
        list.push(k + ' 불일치 (나: ' + v1 + ' / 상대: ' + v2 + ')');
      }
    });
    return list;
  }

  const AWARD_LEGAL_BASIS = [
    '헌법 제10조 (인간의 존엄과 가치) — "모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다."',
    '헌법 제32조 1항 (근로의 권리와 적정임금) — "모든 국민은 근로의 권리를 가진다. 국가는 사회적·경제적 방법으로 근로자의 고용의 증진과 적정임금의 보장에 노력하여야 하며, 법률이 정하는 바에 의하여 최저임금제를 시행하여야 한다."',
    '근로기준법 제54조 (휴게) — 4시간마다 30분, 8시간마다 1시간의 휴게시간을 근로시간 도중에 주어야 한다.',
    '근로기준법 제55조 (휴일) — 사용자는 근로자에게 1주에 평균 1회 이상의 유급휴일을 보장하여야 한다.',
    '근로기준법 제56조 (연장·야간·휴일 근로) — 연장·야간·휴일 근로에 대하여는 통상임금의 100분의 50 이상을 가산하여 지급하여야 한다.',
    '국민연금법·국민건강보험법·고용보험법·산업재해보상보험법 — 일정 요건을 충족하는 근로자는 4대보험 가입이 원칙적으로 의무이다.'
  ];

  function pillGroup(name, items){
    return items.map(function(item, i){
      return '<button type="button" class="choice-pill" data-group="' + name + '" data-value="' + esc(item) + '">' + esc(item) + '</button>';
    }).join('');
  }

  function bindPills(container){
    container.querySelectorAll('.choice-pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.classList.toggle('selected');
      });
    });
  }

  function renderWritingForm(s){
    const box = document.getElementById('writingForm');
    const unprotectedItems = (s.unprotected||'').split(',').map(function(t){return t.trim();}).filter(Boolean);
    const protectedItems = (s.protected||'').split(',').map(function(t){return t.trim();}).filter(Boolean);
    const mismatchItems = currentMismatches || [];

    if(s.activityType === '고소장(진정서)'){
      const violationItems = mismatchItems.concat(unprotectedItems);
      box.innerHTML =
        (mismatchItems.length ? '<div class="explain-text" style="margin-bottom:10px;">💡 협상 상대와 계약 내용이 다르게 기재되어 있어요. 이것도 위반 항목으로 선택할 수 있어요.</div>' : '') +
        '<div class="choice-group"><div class="glabel">위반 항목 선택 (해당되는 것 모두 선택)</div>' + pillGroup('violation', violationItems) + '</div>' +
        '<div class="choice-group"><div class="glabel">요구사항 선택</div>' + pillGroup('demand', ['치료비 보상','미지급 수당 지급','재발방지 대책 마련','정당한 계약 재체결']) + '</div>' +
        '<label>사건 경위 및 상세 진술</label><textarea id="freeText" placeholder="어떤 일이 있었는지, 왜 부당하다고 생각하는지 구체적으로 작성해주세요."></textarea>';
    } else if(s.activityType === '보상 요구서'){
      box.innerHTML =
        '<div class="choice-group"><div class="glabel">청구 근거 선택 (해당되는 것 모두 선택)</div>' + pillGroup('basis', protectedItems) + '</div>' +
        '<div class="choice-group"><div class="glabel">요구사항 선택</div>' + pillGroup('demand', ['치료비 지급','정당한 수당 지급','휴양 기간 보장','기타 정당한 조치']) + '</div>' +
        '<label>상세 진술</label><textarea id="freeText" placeholder="어떤 근거로 이 보상을 요구하는지 구체적으로 작성해주세요."></textarea>';
    } else if(s.activityType === '변론서'){
      box.innerHTML =
        (mismatchItems.length ? '<div class="choice-group"><div class="glabel">계약 내용 불일치 항목 (인지 및 해명 필요)</div>' + pillGroup('mismatch', mismatchItems) + '</div>' : '') +
        '<div class="choice-group"><div class="glabel">대응 방향 선택</div>' + pillGroup('response', ['정당한 계약이었음을 주장','일부 인정 및 재발방지 약속','추가 보상 제공 제안']) + '</div>' +
        '<label>변론 내용</label><textarea id="freeText" placeholder="고소 내용에 대해 관리자 입장에서 어떻게 반박·해명할지 작성해주세요."></textarea>';
    } else if(s.activityType === '청렴한 관리자상 소감문'){
      box.innerHTML =
        '<div class="info-card"><div class="info-title">📚 참고할 법적 근거자료</div><ul>' +
          AWARD_LEGAL_BASIS.map(function(item){ return '<li>' + esc(item) + '</li>'; }).join('') +
        '</ul></div>' +
        '<label>소감문</label><textarea id="freeText" placeholder="당신이 협상한 근로조건이 왜 법적·윤리적으로 올바른 선택이었는지, 위 근거자료를 인용해서 서술해주세요."></textarea>';
    } else {
      box.innerHTML = '<p style="font-family:-apple-system, sans-serif; font-size:13px; opacity:0.7;">해당 활동에 대한 데이터가 없습니다. 선생님께 문의해주세요.</p>';
    }
    bindPills(box);
  }

  document.getElementById('submitBtn').addEventListener('click', function(){
    if(!current) return;
    const freeTextEl = document.getElementById('freeText');
    const freeText = freeTextEl ? freeTextEl.value.trim() : '';
    if(freeTextEl && freeText.length < 10){
      alert('내용을 조금 더 구체적으로 작성해주세요 (10자 이상).');
      return;
    }
    const selectedPills = Array.from(document.querySelectorAll('#writingForm .choice-pill.selected')).map(function(b){ return b.dataset.value; });

    let typeEn = 'DOCUMENT';
    if(current.activityType==='고소장(진정서)') typeEn='COMPLAINT';
    else if(current.activityType==='보상 요구서') typeEn='COMPENSATION CLAIM';
    else if(current.activityType==='변론서') typeEn='DEFENSE STATEMENT';
    else if(current.activityType==='청렴한 관리자상 소감문') typeEn='AWARD SPEECH';

    document.getElementById('certType').textContent = typeEn;
    document.getElementById('certTitleText').textContent = current.activityType;
    document.getElementById('certMeta').innerHTML =
      '<div class="cert-row"><span class="k">학번/이름</span><span class="v">' + esc(current.num + ' ' + current.name) + '</span></div>' +
      '<div class="cert-row"><span class="k">사업장</span><span class="v">' + esc(current.company) + '</span></div>' +
      '<div class="cert-row"><span class="k">역할</span><span class="v">' + esc(current.role) + '</span></div>' +
      (selectedPills.length ? '<div class="cert-row"><span class="k">선택 항목</span><span class="v">' + esc(selectedPills.join(', ')) + '</span></div>' : '');

    document.getElementById('certBodyText').textContent = freeText || '(작성 내용 없음)';

    const today = new Date();
    document.getElementById('certDate').textContent = today.getFullYear() + '년 ' + (today.getMonth()+1) + '월 ' + today.getDate() + '일 제출';

    try{
      document.getElementById('gf_num').value = current.studentId || current.num;
      document.getElementById('gf_name').value = current.name;
      document.getElementById('gf_class').value = current.class;
      document.getElementById('gf_company').value = current.company;
      document.getElementById('gf_role').value = current.role;
      document.getElementById('gf_activity').value = current.activityType;
      document.getElementById('gf_selected').value = selectedPills.join(', ');
      document.getElementById('gf_freetext').value = freeText;
      document.getElementById('gf_partner').value = current.partner || '';
      document.getElementById('crisisFormBridge').submit();
    }catch(e){ console.error('구글시트 기록 실패', e); }

    resultSection.classList.add('hidden');
    certSection.classList.remove('hidden');
  });

  document.getElementById('downloadBtn').addEventListener('click', function(){
    const target = document.getElementById('certificate');
    html2canvas(target, { backgroundColor: '#f1ead8', scale: 2 }).then(function(canvas){
      const link = document.createElement('a');
      const nameForFile = (current ? current.name : '학생');
      link.download = (current ? current.activityType : '문서') + '_' + nameForFile + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(function(e){
      console.error(e);
      alert('이미지 저장에 실패했어요. 화면을 길게 눌러 캡처해 저장해주세요.');
    });
  });

  document.getElementById('restartBtn').addEventListener('click', function(){
    certSection.classList.add('hidden');
    searchSection.classList.remove('hidden');
    numInput.value=''; nameInput.value='';
    current = null;
  });

})();
</script>
</body>
</html>

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const rosterInput = document.getElementById('rosterInput');

  const groupPreview = document.getElementById('groupPreview');

  function getRoster(){
    return rosterInput.value.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
  }

  function computeGroupSizes(n){
    let bestG = null;
    for(let g = Math.floor(n / 4); g >= 1; g--){
      if(n <= 6 * g){ bestG = g; break; }
    }
    if(bestG === null){
      bestG = Math.max(1, Math.round(n / 5));
    }
    const sizes = new Array(bestG).fill(4);
    let remaining = n - 4 * bestG;
    let i = 0;
    let guard = 0;
    while(remaining > 0 && guard < 10000){
      guard++;
      if(sizes[i] < 6){
        sizes[i]++;
        remaining--;
      }
      i = (i + 1) % bestG;
      if(sizes.every(function(s){ return s >= 6; }) && remaining > 0){
        sizes[sizes.length - 1] += remaining;
        remaining = 0;
      }
    }
    return sizes;
  }

  function summarizeSizes(sizes){
    const counts = {};
    sizes.forEach(function(s){ counts[s] = (counts[s] || 0) + 1; });
    const keys = Object.keys(counts).map(Number).sort(function(a,b){ return a-b; });
    return keys.map(function(k){ return counts[k] + '모둠 × ' + k + '명'; }).join(', ');
  }

    warnBox.classList.remove('show');
    if(n === 0){
      groupPreview.textContent = '명단을 입력하면 최대한 4인 조로 묶고, 남는 인원은 5~6인 조로 흡수해서 자동 편성돼요.';
      drawBtn.disabled = true;
      return;
    }
    if(n < 4){
      groupPreview.textContent = '최소 4명 이상 입력해주세요.';
      drawBtn.disabled = true;
      return;
    }
    const sizes = computeGroupSizes(n);
    groupPreview.innerHTML = '총 <b>' + n + '명</b> → <b>' + sizes.length + '모둠</b>으로 자동 편성돼요<br><span style="opacity:0.7; font-size:12.5px;">(' + summarizeSizes(sizes) + ')</span>';
    if(sizes.some(function(s){ return s > 6; })){
      warnBox.textContent = '⚠️ 인원이 애매해서 일부 모둠이 6명을 넘을 수 있어요. 결과를 확인 후 수동으로 조정해주세요.';
      warnBox.classList.add('show');
    }
    drawBtn.disabled = false;
  }
  rosterInput.addEventListener('input', updateCount);

  function dealGroups(names, sizes){
    const shuffled = shuffle(names);
    const shuffledSizes = shuffle(sizes);
    const groups = [];
    let idx = 0;
    shuffledSizes.forEach(function(sz){
      groups.push(shuffled.slice(idx, idx + sz));
      idx += sz;
    });
    return groups;
  }

  function assignWorkplaces(numGroups){
    let pool = shuffle(WORKPLACES);
    const result = [];
    for(let i = 0; i < numGroups; i++){
      if(pool.length === 0) pool = shuffle(WORKPLACES);
      result.push(pool.pop());
    }
    return result;
  }

  function pickTitle(list, idx){
    const base = list[idx % list.length];
    const round = Math.floor(idx / list.length);
    return {
      title: round > 0 ? base.title + ' (' + (round + 1) + ')' : base.title,
      desc: base.desc
    };
  }

  function assignRoles(group, workplace){
    const members = shuffle(group);
    const half = Math.floor(members.length / 2);
    let managerCount = half;
    if(members.length % 2 !== 0){
      managerCount = Math.random() < 0.5 ? half : half + 1;
    }
    const managers = members.slice(0, managerCount);
    const workers = members.slice(managerCount);
    const managerTitles = shuffle(workplace.managers);
    const workerTitles = shuffle(workplace.workers);
    const managerAssignments = managers.map(function(name, i){
      const t = pickTitle(managerTitles, i);
      return { name: name, role: 'manager', roleLabel: '관리직 노동자', title: t.title, desc: t.desc };
    });
    const workerAssignments = workers.map(function(name, i){
      const t = pickTitle(workerTitles, i);
      return { name: name, role: 'worker', roleLabel: '실무직 노동자', title: t.title, desc: t.desc };
    });
    return managerAssignments.concat(workerAssignments);
  }

  let lastResult = null;

  function runDraw(){
    const roster = getRoster();
    if(roster.length < 4) return;
    const sizes = computeGroupSizes(roster.length);
    const groups = dealGroups(roster, sizes);
    const workplaces = assignWorkplaces(groups.length);
    const result = groups.map(function(group, i){
      return {
        groupNumber: i + 1,
        workplace: workplaces[i],
        members: assignRoles(group, workplaces[i])
      };
    });
    lastResult = result;
    renderResult(result);
    submitAllToSheet(result);
  }

  const sheetQueue = [];
  let sheetSending = false;

  document.getElementById('sheet_hidden_iframe').addEventListener('load', function(){
    if(sheetSending){
      sheetSending = false;
      processSheetQueue();
    }
  });

  function processSheetQueue(){
    if(sheetSending) return;
    if(sheetQueue.length === 0) return;
    const row = sheetQueue.shift();
    sheetSending = true;
    try{
      document.getElementById('gf_group').value = row.groupNumber;
      document.getElementById('gf_workplace').value = row.workplace;
      document.getElementById('gf_name').value = row.name;
      document.getElementById('gf_role').value = row.role;
      document.getElementById('gf_title').value = row.title;
      document.getElementById('resultFormBridge').submit();
    }catch(e){
      console.error('구글시트 기록 실패', e);
      sheetSending = false;
      processSheetQueue();
    }
  }

  function submitAllToSheet(result){
    result.forEach(function(g){
      g.members.forEach(function(m){
        sheetQueue.push({
          groupNumber: g.groupNumber,
          workplace: g.workplace.name,
          name: m.name,
          role: m.roleLabel,
          title: m.title
        });
      });
    });
    processSheetQueue();
  }

  function renderResult(result){
    const container = document.getElementById('groupsContainer');
    container.innerHTML = '';
    result.forEach(function(g, idx){
      const card = document.createElement('div');
      card.className = 'group-card';
      card.style.animationDelay = (idx * 0.12) + 's';

      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = '<span class="gname">모둠 ' + g.groupNumber + '</span><span class="wname">' + g.workplace.name + '</span>';
      card.appendChild(head);

      g.members.forEach(function(m){
        const row = document.createElement('div');
        row.className = 'member-row';
        row.innerHTML =
          '<div class="member-top">' +
            '<div><div class="member-name">' + escapeHtml(m.name) + '</div><div class="member-title">' + escapeHtml(m.title) + '</div></div>' +
            '<div class="role-badge ' + m.role + '">' + m.roleLabel + '</div>' +
          '</div>' +
          '<div class="member-desc">' + escapeHtml(m.desc) + '</div>';
        card.appendChild(row);
      });

      container.appendChild(card);
    });

    document.getElementById('formSection').style.display = 'none';
    document.getElementById('resultSection').classList.add('show');
  }

  function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  drawBtn.addEventListener('click', runDraw);

  document.getElementById('redrawBtn').addEventListener('click', function(){
    document.getElementById('resultSection').classList.remove('show');
    document.getElementById('formSection').style.display = 'block';
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    if(!lastResult) return;
    let text = '⚖️ 직업 배정 결과\n\n';
    lastResult.forEach(function(g){
      text += '모둠 ' + g.groupNumber + ' · ' + g.workplace.name + '\n';
      g.members.forEach(function(m){
        text += '  - ' + m.name + ' : ' + m.roleLabel + ' (' + m.title + ') — ' + m.desc + '\n';
      });
      text += '\n';
    });

    function showToast(){
      const toast = document.getElementById('copyToast');
      toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2000);
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showToast).catch(function(){
        fallbackCopy(text, showToast);
      });
    }else{
      fallbackCopy(text, showToast);
    }
  });

  function fallbackCopy(text, cb){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    cb();
  }

})();
</script>
</body>
</html>

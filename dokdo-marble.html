<title>독도마블</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  /* Layout: 실물 말판과 같은 40칸 링 보드(11×11) + 진행 패널. 좁은 화면에서는 패널이 보드 아래로 */
  --sky:#e6f2fa; --paper:#ffffff; --ink:#16314a; --muted:#587088; --line:#cddfeb;
  --sea:#1c7cc0; --deep:#0d4677; --wave:#8fcdf0;
  --sun:#f6c744; --sand:#c99a55; --coral:#ee6a5f;
  --good:#1d9a60; --bad:#d64545; --hibiscus:#e86fa0;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 10% 0%, #fff 0, transparent 40%),radial-gradient(circle at 100% 100%, #d4ebf8 0, transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--hibiscus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-family:var(--display);font-size:clamp(22px,4vw,30px);color:var(--deep);line-height:1.1;margin:0}
.brand small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--sea)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ---------- Board ---------- */
.board{display:grid;width:100%;max-width:720px;margin:0 auto;aspect-ratio:1;max-height:calc(100vh - 110px);
  grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;
  gap:2px;padding:3px;background:var(--deep);border-radius:14px;box-shadow:0 10px 30px rgba(13,70,119,.18)}
@media (max-width:900px){.board{max-height:none}}
.tile{position:relative;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2px;font-size:clamp(7px,1.35vw,11.5px);line-height:1.15;font-weight:700;border:0;border-radius:2px;word-break:keep-all}
.tile:hover{filter:brightness(.97)}
.tile .nm{position:relative;z-index:1;padding:0 1px}
.tile.b::before,.tile.t::before,.tile.l::before,.tile.r::before{content:"";position:absolute;background:var(--band)}
.tile.b::before{left:0;right:0;top:0;height:20%}
.tile.t::before{left:0;right:0;bottom:0;height:20%}
.tile.l::before{top:0;bottom:0;right:0;width:20%}
.tile.r::before{top:0;bottom:0;left:0;width:20%}
.g-sun{--band:var(--sun)} .g-sand{--band:var(--sand)} .g-coral{--band:var(--coral)} .g-sea{--band:var(--sea)}
.tile.sp{background:#f3f8fc}
.tile.sp .nm{color:var(--deep)}
.tile.c{background:linear-gradient(160deg,#fff,#dcefFA);font-family:var(--display);font-weight:400;font-size:clamp(9px,1.7vw,15px);color:var(--deep)}
.tile.c .ico{font-size:1.5em;line-height:1}
.tile.pick{animation:pulse 1.1s infinite;cursor:crosshair}
@keyframes pulse{50%{background:#fff4c2}}
.tile.here{box-shadow:inset 0 0 0 2px var(--hibiscus)}
.own{position:absolute;z-index:2;display:flex;gap:1px;justify-content:center;align-items:center;color:#fff;font-size:.8em;line-height:1;padding:1px 2px;border-radius:3px}
.tile.b .own{bottom:2px;left:2px;right:2px}
.tile.t .own{top:2px;left:2px;right:2px}
.tile.l .own{left:2px;top:2px;bottom:2px;flex-direction:column;width:auto;right:auto}
.tile.r .own{right:2px;top:2px;bottom:2px;flex-direction:column;left:auto}
.tokens{position:absolute;z-index:3;inset:auto 0 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;padding:1px;pointer-events:none}
.tile.b .tokens{bottom:22%}
.tile.t .tokens{top:22%;bottom:auto}
.tok{width:clamp(9px,2.1vw,17px);height:clamp(9px,2.1vw,17px);border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
  color:#fff;font-size:clamp(6px,1.2vw,10px);display:grid;place-items:center;font-weight:900}
.tok.now{outline:2px solid var(--ink);outline-offset:1px}

.center{grid-row:2/11;grid-column:2/11;background:linear-gradient(180deg,#f7fbfe 0%,#e2f1fb 60%,#cfe8f7 100%);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.4vw,14px);padding:6px;position:relative;overflow:hidden}
.center .eyebrow{font-weight:700;color:var(--muted);font-size:clamp(9px,1.6vw,14px);letter-spacing:.02em}
.center h2{margin:0;font-family:var(--display);font-weight:400;color:var(--sea);font-size:clamp(26px,7vw,64px);line-height:1;
  text-shadow:0 3px 0 var(--deep)}
.isles{width:clamp(70px,18vw,150px);height:auto}
.vault{background:var(--paper);border:2px solid var(--sun);border-radius:12px;padding:clamp(3px,1vw,8px) clamp(8px,2vw,16px);text-align:center}
.vault span{display:block;font-size:clamp(8px,1.4vw,12px);color:var(--muted);font-weight:700}
.vault b{font-family:var(--display);font-weight:400;font-size:clamp(14px,3.2vw,26px);color:var(--deep);font-variant-numeric:tabular-nums}
.dicebox{display:flex;gap:8px;align-items:center}
.die{width:clamp(26px,6vw,46px);height:clamp(26px,6vw,46px);background:#fff;border-radius:22%;border:2px solid var(--deep);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 3px 0 var(--deep)}
.die i{border-radius:50%;background:var(--deep);margin:12%;visibility:hidden}
.die i.on{visibility:visible}
.die.six i.on{background:var(--bad)}
.die.roll{animation:shake .5s}
@keyframes shake{25%{transform:rotate(-14deg)}50%{transform:rotate(10deg) translateY(-3px)}75%{transform:rotate(-5deg)}}

/* ---------- Panel ---------- */
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--paper);border-radius:14px;border:1px solid var(--line);padding:14px}
.turn{border:0;box-shadow:0 6px 20px rgba(13,70,119,.12);overflow:hidden;padding:0}
.turnhead{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:var(--pc,var(--sea))}
.turnhead .who{font-family:var(--display);font-size:22px;line-height:1.1;flex:1;min-width:0}
.turnhead .who small{display:block;font-family:var(--body);font-size:12px;opacity:.9}
.turnhead .money{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.turnbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.where{font-size:13px;color:var(--muted)}
.where b{color:var(--ink)}
.msg{margin:0;font-size:15px;font-weight:500;text-wrap:pretty}
.msg.warn{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--sea);color:#fff;box-shadow:0 3px 0 var(--deep);flex:1 1 auto;min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:#eef5fa;color:var(--deep);box-shadow:0 3px 0 var(--line)}
.btn.warm{background:var(--coral);box-shadow:0 3px 0 #b8473e}
.btn.gold{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 #c79a17}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{font-family:var(--display);font-weight:400;font-size:22px;min-height:58px}
.seg{display:flex;background:#eef5fa;border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--deep);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pick6{display:grid;grid-template-columns:auto repeat(6,1fr);gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.pick6 button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;font-weight:900;font-variant-numeric:tabular-nums}
.pick6 button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.hold{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef5fa;color:var(--deep)}

.h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;color:var(--deep)}
.players{display:grid;gap:10px}
.pl{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;border-left:6px solid var(--pc)}
.pl.cur{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 7%,#fff)}
.pl.out{opacity:.5}
.pl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl-top b{font-size:16px}
.pl-top .dp{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.pl-top .dp.neg{color:var(--bad)}
.props{display:flex;flex-wrap:wrap;gap:4px}
.prop{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#f4f8fb;border-left:4px solid var(--band)}
.lv{color:var(--muted);font-weight:500}
.status{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--muted);max-height:180px;overflow:auto}
.log li b{color:var(--ink)}
details.tools summary{cursor:pointer;font-family:var(--display);font-size:18px;color:var(--deep);list-style:none}
details.tools summary::-webkit-details-marker{display:none}
details.tools summary::after{content:" ▾";font-size:14px}
.tgrid{display:grid;gap:12px;margin-top:10px}
.trow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trow label{font-size:13px;color:var(--muted);width:100%}
select,input[type=number],input[type=text]{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;min-width:0;flex:1 1 90px}
.sbtn{border:0;border-radius:8px;padding:8px 12px;background:var(--deep);color:#fff;font-weight:700;font-size:13px}
.sbtn.red{background:var(--bad)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,40,70,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--paper);border-radius:18px;width:min(520px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mhead{padding:16px 18px;color:#fff;background:var(--mh,var(--sea));border-radius:18px 18px 0 0}
.mhead .tag{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.04em}
.mhead h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.25;text-wrap:balance}
.mbody{padding:18px;display:grid;gap:12px}
.q{font-size:18px;font-weight:700;margin:0;line-height:1.5;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;font-weight:500;display:flex;gap:10px;align-items:center}
.opts.ox .opt{justify-content:center;font-family:var(--display);font-size:40px;padding:10px}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:#eef5fa;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--deep)}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt.right{border-color:var(--good);background:#e5f6ec}
.opt.wrong{border-color:var(--bad);background:#fde9e9}
.opt:disabled{cursor:default}
.result{border-radius:12px;padding:12px 14px;font-size:15px}
.result.ok{background:#e5f6ec;color:#11603b}
.result.no{background:#fde9e9;color:#8f2525}
.result p{margin:4px 0 0;color:var(--ink);font-weight:400}
.qtimer{display:flex;align-items:center;gap:10px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--deep)}
.qtimer .track{flex:1;height:10px;background:#eef5fa;border-radius:999px;overflow:hidden}
.qtimer .fill{height:100%;width:100%;background:var(--sea);border-radius:999px;transition:width 1s linear,background .3s}
.qtimer.low{color:var(--bad)} .qtimer.low .fill{background:var(--bad)}
.modal.wide{width:min(900px,100%)}
table.ptab{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
table.ptab th,table.ptab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.ptab th{background:#f3f8fc;color:var(--deep);font-size:12px}
table.ptab td:first-child,table.ptab th:first-child{text-align:left;position:sticky;left:0;background:var(--paper);z-index:1}
table.ptab th:first-child{background:#f3f8fc}
table.ptab td:first-child{border-left:5px solid var(--band);font-weight:700}
table.ptab td.cur{background:#fff3c4;font-weight:900}
table.ptab .sep{border-left:2px solid var(--line)}
.keycard{border:3px dashed var(--sun);border-radius:14px;padding:18px;text-align:center;background:#fffbea}
.keycard h4{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--deep)}
.keycard p{margin:0;font-size:16px}
table.price{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.price th,table.price td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.price th:first-child,table.price td:first-child{text-align:left}
table.price tr.now td{background:#fff6d6;font-weight:700}
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;border-left:6px solid var(--pc)}
.rk .no{font-family:var(--display);font-size:26px;color:var(--deep);text-align:center}
.rk.first{background:#fff8dc;border-color:var(--sun)}
.rk .tot{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.rk small{display:block;color:var(--muted);font-size:12px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.setup-grid{display:grid;gap:10px}
.nameRow{display:flex;gap:8px;align-items:center}
.nameRow .dot{width:18px;height:18px;border-radius:50%;flex:none}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--deep);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <h1 class="brand">독도 한바퀴: 독도마블<small>독도의 날 기념 놀이 · 실물 말판 보조 앱</small></h1>
    <div class="topbtns">
      <button class="ghost" id="btnPrice">거점 가격표</button>
      <button class="ghost" id="btnRules">규칙 보기</button>
      <button class="ghost" id="btnRank">현재 순위</button>
    </div>
  </div>
  <div class="layout">
    <div class="board" id="board"></div>
    <aside class="panel">
      <section class="card turn" id="turn"></section>
      <section class="card">
        <h3 class="h3">플레이어</h3>
        <div class="players" id="players"></div>
      </section>
      <section class="card">
        <h3 class="h3">진행 기록</h3>
        <ul class="log" id="log"></ul>
      </section>
      <section class="card">
        <details class="tools" id="tools">
          <summary>선생님 도구</summary>
          <div class="tgrid" id="toolBody"></div>
        </details>
      </section>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

 {q:'독도는 동해의 따뜻한 해류의 영향을 받아 바다를 끼고 있는 해양성 기후를 보인다.',o:['O','X'],a:0,e:'독도는 바다의 영향을 크게 받아 여름과 겨울의 기온 차가 내륙보다 작아요.'}

 {h:'해양 쓰레기 정화 활동',d:'독도 바다를 깨끗하게! 봉사 장학금 20,000 DP를 받아요.',fx:p=>{gain(p,20000);return'장학금 +20,000 DP'}},
 {h:'독도 연구 발표 대회 입상',d:'멋진 탐구 발표로 상금 50,000 DP를 받아요.',fx:p=>{gain(p,50000);return'상금 +50,000 DP'}},
 {h:'독도의 날 축하금',d:'모든 친구에게서 10,000 DP씩 축하금을 받아요.',fx:p=>{alive().forEach(q=>{if(q!==p)transfer(q,p,10000)});return'친구들에게 축하금을 받았어요'}},
 {h:'독도 탐방 경비 분담',d:'모든 친구에게 10,000 DP씩 나눠 줘요.',fx:p=>{alive().forEach(q=>{if(q!==p)transfer(p,q,10000)});return'친구들에게 경비를 나눠 줬어요'}},
 {h:'풍랑 주의보 발효',d:'무인도로 바로 이동해요. 출발지를 지나도 지원금은 없어요.',fx:async p=>{p.pos=10;render();return {resolve:true}}},
 {h:'울릉도에서 다시 출발',d:'출발지(도동항)로 이동해 완주 지원금을 받아요.',fx:async p=>{await moveTo(p,0);return {resolve:true}}},
 {h:'헬기 탑승권',d:'독도 헬기장으로 이동해요. 출발지를 지나면 지원금을 받아요.',fx:async p=>{await moveTo(p,20);return {resolve:true}}},
 {h:'맞바람',d:'거센 바람에 뒤로 3칸 밀려나요.',fx:async p=>{await moveBy(p,-3);return {resolve:true}}},

 {h:'무인도 탈출권',d:'보관했다가 무인도에 갇혔을 때 바로 탈출할 수 있어요.',fx:p=>{p.esc++;return'무인도 탈출권을 보관했어요'}},
 {h:'통행료 면제권',d:'보관했다가 친구 거점에 도착했을 때 통행료를 한 번 내지 않아요.',fx:p=>{p.free++;return'통행료 면제권을 보관했어요'}},
 {h:'시설 안전 점검',d:'내 거점의 시설 1단계마다 10,000 DP를 성금함에 내요.',fx:p=>{let n=0;for(const k in S.own){const o=S.own[k];if(o.owner===S.players.indexOf(p))n+=o.level-1}const a=n*10000;if(a)toVault(p,a);return a?`점검비 ${fmt(a)}를 성금함에 냈어요`:'지을 시설이 없어 점검비가 없어요'}},
 {h:'독도 수호 성금 기부',d:'20,000 DP를 중앙 성금함에 기부해요.',fx:p=>{toVault(p,20000);return'성금함에 20,000 DP를 기부했어요'}},
 {h:'깜짝 독도 퀴즈',d:'퀴즈를 맞히면 50,000 DP! 틀려도 벌금은 없어요.',fx:p=>({quiz:50000})}
];

/* ================= 상태 ================= */
const SAVE='dokdo-marble-v2';
let S=null, busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR')+' DP';
const sleep=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?0:ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cp=()=>S.players[S.cur];
const alive=()=>S.players.filter(p=>!p.out);
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}};
const load=()=>{try{const v=localStorage.getItem(SAVE);return v?JSON.parse(v):null}catch(e){return null}};

function newGame(names){const dice=1;
  S={players:names.map((n,i)=>({name:n,color:PL_COLORS[i],dp:START_DP,pos:0,island:0,heli:false,rest:0,esc:0,free:0,half:0,out:false})),
     own:{},vault:0,cur:0,phase:'roll',pend:null,msg:'',dice,mode:'app',last:null,pick:[0,0],log:[],qd:[],kd:[],turnNo:1};
  log(`게임 시작! 모두 ${fmt(START_DP)}를 받았어요.`);
  render();
  if($('#tools').open)renderTools();
}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,40)}
function toast(t){const r=$('#toastRoot');r.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>r.innerHTML='',2200)}

/* ================= 돈 ================= */
function gain(p,a){p.dp+=a}
function transfer(from,to,a){from.dp-=a;to.dp+=a}
function toVault(p,a){p.dp-=a;S.vault+=a}
const tollOf=i=>{const o=S.own[i];return o?T[i].p*TOLL[o.level]:0};
const buildCost=i=>T[i].p*BUILD[S.own[i].level];
const investOf=i=>{const o=S.own[i];return o?T[i].p*INVEST[o.level]:0};

/* ================= 이동 ================= */
async function moveBy(p,steps){
  busy=true;
  const dir=steps<0?-1:1;
  for(let k=0;k<Math.abs(steps);k++){
    p.pos=(p.pos+dir+N)%N;
    if(dir>0&&p.pos===0){gain(p,START_BONUS);log(`<b>${esc(p.name)}</b> 출발지 통과 +200,000 DP`);toast(`${p.name} 출발지 통과! +200,000 DP`)}
    render();await sleep(150);
  }
  busy=false;
}
async function moveTo(p,dest){const st=(dest-p.pos+N)%N;await moveBy(p,st===0?N:st)}

/* ================= 턴 진행 ================= */
function diceFaces(){return S.last||Array(S.dice).fill(0)}
async function rollApp(){
  if(busy)return;busy=true;
  for(let k=0;k<7;k++){S.last=Array.from({length:S.dice},()=>1+(Math.random()*6|0));renderCenter(true);await sleep(60)}
  busy=false;
  await doRoll(S.last);
}
async function doRoll(vals){
  const p=cp();S.last=vals;const sum=vals.reduce((a,b)=>a+b,0);
  if(p.island>0){
    if(vals.includes(6)){p.island=0;log(`<b>${esc(p.name)}</b> 6이 나와 무인도 탈출!`);toast('6! 무인도 탈출!')}
    else{p.island--;S.phase='done';S.msg=p.island>0?`탈출 실패… 남은 기회 ${p.island}번.`:'탈출 실패… 3턴을 다 쉬었으니 다음 턴부터는 자유롭게 움직여요.';
      log(`<b>${esc(p.name)}</b> 무인도 탈출 실패 (${vals.join('+')})`);render();return}
  }
  log(`<b>${esc(p.name)}</b> 주사위 ${vals.join(' + ')}${vals.length>1?' = '+sum:''}`);
  await moveBy(p,sum);
  resolveTile(p);
}
async function heliTo(i){
  const p=cp();if(i===p.pos){toast('지금 있는 칸이에요. 다른 칸을 골라 주세요.');return}
  if(T[i].t==='GUARD'){toast('독도 의용수비대 칸으로는 헬기로 갈 수 없어요.');return}
  p.heli=false;log(`<b>${esc(p.name)}</b> 헬기로 ${esc(T[i].f)}까지 이동`);
  busy=true;const st=(i-p.pos+N)%N;
  for(let k=0;k<st;k++){p.pos=(p.pos+1)%N;if(p.pos===0){gain(p,START_BONUS);log(`<b>${esc(p.name)}</b> 출발지 통과 +200,000 DP`);toast(`${p.name} 출발지 통과! +200,000 DP`)}render();await sleep(45)}
  busy=false;resolveTile(p);
}
function resolveTile(p){
  const i=p.pos,t=T[i],me=S.cur;S.pend=null;S.phase='done';
  switch(t.t){
    case 'START':S.msg='출발지에 도착! 완주 지원금을 받았어요.';break;
    case 'PROP':{
      const o=S.own[i];
      if(!o){S.phase='act';S.pend={k:'buy',i}}
      else if(o.owner===me){ if(o.level<4){S.phase='act';S.pend={k:'build',i}} else S.msg='이미 독도 수호 센터까지 완성한 내 거점이에요!'}
      else{S.phase='act';S.pend={k:'toll',i}}
      break}
    case 'QUIZ':S.phase='act';S.pend={k:'quiz'};break;
    case 'KEY':S.phase='act';S.pend={k:'key'};break;
    case 'DPAY':toVault(p,DONATE);S.msg='독도 수호 성금 10,000 DP를 성금함에 냈어요.';log(`<b>${esc(p.name)}</b> 성금 납부 10,000 DP`);break;
    case 'DTAKE':{const a=S.vault;gain(p,a);S.vault=0;S.msg=a?`성금함의 ${fmt(a)}를 모두 받았어요!`:'아직 성금함이 비어 있어요.';if(a)log(`<b>${esc(p.name)}</b> 성금함 ${fmt(a)} 수령`);break}
    case 'GUARD':{const ok=Object.keys(S.own).some(k=>S.own[k].owner===me&&S.own[k].level<4);
      if(ok){S.phase='act';S.pend={k:'guard'}}else S.msg='독도 의용수비대 도착! 하지만 업그레이드할 수 있는 내 거점이 없어요.';break}
    case 'HELI':p.heli=true;S.msg='독도 헬기장 도착! 다음 턴에는 주사위 대신 가고 싶은 칸을 골라요.';break;
    case 'ISLAND':p.island=3;S.msg='풍랑 주의보로 무인도에 갇혔어요. 다음 턴부터 6이 나오면 탈출!';log(`<b>${esc(p.name)}</b> 무인도에 갇힘`);break;
  }
  render();
}
function endTurn(){
  if(busy)return;
  if(alive().length<=1){showRank(true);return}
  let n=S.cur;do{n=(n+1)%S.players.length}while(S.players[n].out);
  if(n<=S.cur)S.turnNo++;
  S.cur=n;S.phase='roll';S.pend=null;S.msg='';S.last=null;S.pick=[0,0];render();
}

/* ================= 액션 ================= */
function actBuy(){const p=cp(),i=S.pend.i,c=T[i].p;transfer(p,{dp:0},c);S.own[i]={owner:S.cur,level:1};
  S.phase='done';S.msg=`${T[i].f} 거점을 확보했어요! 다음에 다시 오면 시설을 지을 수 있어요.`;log(`<b>${esc(p.name)}</b> ${esc(T[i].f)} 확보 (${fmt(c)})`);render()}
function actBuild(){const p=cp(),i=S.pend.i,c=buildCost(i);p.dp-=c;S.own[i].level++;
  S.phase='done';S.msg=`${LV_NAME[S.own[i].level]} 완공! 이제 통행료는 ${fmt(tollOf(i))}예요.`;log(`<b>${esc(p.name)}</b> ${esc(T[i].f)}에 ${LV_NAME[S.own[i].level]} 건설 (${fmt(c)})`);render()}
function actSkip(){S.phase='done';S.msg='이번에는 그냥 지나가요.';render()}
function actFree(){const p=cp(),i=S.pend.i;p.free--;S.phase='done';S.msg='통행료 면제권을 사용했어요. 통행료 0 DP!';log(`<b>${esc(p.name)}</b> 통행료 면제권 사용 (${esc(T[i].f)})`);render()}
function actToll(useHalf){
  const p=cp(),i=S.pend.i,o=S.own[i],owner=S.players[o.owner],base=tollOf(i);
  const a=useHalf?Math.round(base*0.5):base;
  if(useHalf)p.half--;
  transfer(p,owner,a);
  log(`<b>${esc(p.name)}</b> → ${esc(owner.name)} 통행료 ${fmt(a)}${useHalf?' (50% 할인권 사용)':''}`);
  S.phase='done';S.msg=useHalf?`할인권을 써서 ${owner.name} 님에게 절반인 ${fmt(a)}만 냈어요.`:`${owner.name} 님에게 통행료 ${fmt(a)}를 냈어요.`;
  render();
}
const HALF_MAX=2;
function actQuizTile(reward,fine=true){
  const p=cp(),tile=fine;
  openQuiz({tag:tile?'독도 퀴즈 칸':'깜짝 독도 퀴즈',color:'#0d4677',
    info:tile?`정답이면 통행료 50% 할인권 1장(최대 ${HALF_MAX}장) · 오답이면 벌금 5,000 DP`:`정답 +${fmt(reward)} · 오답이어도 벌금 없음`,
    settle:ok=>{
      if(tile){
        if(ok){
          if(p.half<HALF_MAX){p.half++;log(`<b>${esc(p.name)}</b> 퀴즈 정답 → 통행료 50% 할인권 적립`);return `통행료 50% 할인권 1장을 받았어요! (보유 ${p.half}장)`}
          gain(p,QUIZ_REWARD);log(`<b>${esc(p.name)}</b> 퀴즈 정답 (할인권 가득) +${fmt(QUIZ_REWARD)}`);return `할인권이 이미 ${HALF_MAX}장이라 대신 ${fmt(QUIZ_REWARD)}를 받았어요.`}
        toVault(p,FINE);log(`<b>${esc(p.name)}</b> 퀴즈 오답 벌금 5,000 DP`);return '벌금 5,000 DP가 성금함으로 갔어요.'}
      if(ok){gain(p,reward);log(`<b>${esc(p.name)}</b> 깜짝 퀴즈 정답 +${fmt(reward)}`);return `정답 상금 ${fmt(reward)}를 받았어요!`}
      return '아쉽지만 상금은 없어요.'},
    done:m=>{S.phase='done';S.msg=m;render()}});
}
function drawKey(){
  if(!S.kd.length)S.kd=shuffle(KEYS.map((_,i)=>i));
  const card=KEYS[S.kd.pop()],p=cp();
  modal(`<div class="mhead" style="--mh:#c79a17"><div class="tag">독도 열쇠</div><h3>${esc(p.name)} 님의 열쇠 카드</h3></div>
   <div class="mbody"><div class="keycard"><h4>${esc(card.h)}</h4><p>${esc(card.d)}</p></div>
   <div class="btns"><button class="btn gold big" id="kgo">카드 내용 실행</button></div></div>`);
  $('#kgo').onclick=async()=>{
    closeModal();log(`<b>${esc(p.name)}</b> 열쇠 카드: ${esc(card.h)}`);
    const r=await card.fx(p);
    if(r&&r.resolve){resolveTile(p);return}
    if(r&&r.quiz){actQuizTile(r.quiz,false);return}
    S.phase='done';S.msg=r||card.h;render();
  };
}
function useEscape(){const p=cp();p.esc--;p.island=0;log(`<b>${esc(p.name)}</b> 무인도 탈출권 사용`);toast('탈출권 사용! 이제 주사위를 굴려요.');render()}
function restOver(){const p=cp();p.rest=0;S.phase='done';S.msg='파견 근무를 마쳤어요. 다음 턴부터 다시 움직여요.';log(`<b>${esc(p.name)}</b> 의용수비대 근무로 1턴 휴식`);render()}
function sellProp(i){
  const p=cp(),r=Math.round(investOf(i)*0.5);gain(p,r);log(`<b>${esc(p.name)}</b> ${esc(T[i].f)} 매각 +${fmt(r)}`);delete S.own[i];render();
}
function bankrupt(){
  const p=cp(),idx=S.cur;for(const k in S.own)if(S.own[k].owner===idx)delete S.own[k];
  p.out=true;p.dp=0;log(`<b>${esc(p.name)}</b> 파산… 거점이 모두 빈 땅이 됐어요`);
  if(alive().length<=1){render();showRank(true);return}
  endTurn();
}

/* ================= 퀴즈 모달 ================= */
function nextQuiz(){if(!S.qd.length)S.qd=shuffle(QUIZ.map((_,i)=>i));return QUIZ[S.qd.pop()]}
function openQuiz(ctx){
  const qz=nextQuiz(),ox=qz.o.length===2,LIMIT=30;
  modal(`<div class="mhead" style="--mh:${ctx.color}"><div class="tag">${esc(ctx.tag)}</div><h3>독도 퀴즈</h3></div>
   <div class="mbody"><div class="qtimer" id="qt"><span>⏱</span><div class="track"><div class="fill" id="qfill"></div></div><span id="qsec">${LIMIT}초</span></div>
   <div class="where">${esc(ctx.info)}</div><p class="q">${esc(qz.q)}</p>
   <div class="opts ${ox?'ox':''}">${qz.o.map((o,k)=>`<button class="opt" data-k="${k}">${ox?'':`<span class="n">${k+1}</span>`}${esc(o)}</button>`).join('')}</div>
   <div id="qres"></div></div>`);
  let left=LIMIT,done=false;
  const tick=()=>{$('#qsec').textContent=left+'초';$('#qfill').style.width=(left/LIMIT*100)+'%';$('#qt').classList.toggle('low',left<=10)};
  const iv=setInterval(()=>{left--;if(!$('#qt')){clearInterval(iv);return}tick();if(left<=0)answer(-1)},1000);
  function answer(k){
    if(done)return;done=true;clearInterval(iv);
    const ok=k===qz.a,timeout=k===-1;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===qz.a)x.classList.add('right')});
    if(!ok&&!timeout)document.querySelector(`.opt[data-k="${k}"]`).classList.add('wrong');
    const m=ctx.settle(ok);
    $('#qres').innerHTML=`<div class="result ${ok?'ok':'no'}"><b>${ok?'정답이에요!':timeout?'시간 초과! 오답 처리':'아쉬워요, 오답!'}</b> ${esc(m)}<p>${esc(qz.e)}</p></div>
      <div class="btns" style="margin-top:12px"><button class="btn" id="qok">확인</button></div>`;
    $('#qok').onclick=()=>{closeModal();ctx.done(m)};$('#qok').focus();
  }
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}

function gridPos(i){if(i<=10)return[11-i,1];if(i<=20)return[1,1+(i-10)];if(i<=30)return[1+(i-20),11];return[11,11-(i-30)]}
function sideOf(i){if(i%10===0)return'c';return i<10?'l':i<20?'t':i<30?'r':'b'}
function groupOf(i){return ['sea','coral','sand','sun'][Math.floor(i/10)]}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML=(v,roll)=>`<div class="die ${v===6?'six':''} ${roll?'roll':''}" aria-label="주사위 ${v||'?'}">${Array.from({length:9},(_,k)=>`<i class="${v&&PIPS[v].includes(k)?'on':''}"></i>`).join('')}</div>`;

function renderBoard(){
  const p=cp(),picking=S.phase==='roll'&&p.heli&&!p.rest;
  let h='';
  T.forEach((t,i)=>{
    const [r,c]=gridPos(i),sd=sideOf(i),o=S.own[i];
    const toks=S.players.map((q,k)=>q.out||q.pos!==i?'':`<span class="tok ${k===S.cur?'now':''}" style="background:${q.color}">${k+1}</span>`).join('');
    const own=o?`<span class="own" style="background:${S.players[o.owner].color}" title="${esc(S.players[o.owner].name)} · ${LV_NAME[o.level]}">${'★'.repeat(o.level)}</span>`:'';
    const cls=['tile',sd,sd==='c'?'':'g-'+groupOf(i),t.t!=='PROP'&&sd!=='c'?'sp':'',picking&&i!==p.pos&&t.t!=='GUARD'?'pick':'',i===p.pos?'here':''].join(' ');
    const label=sd==='c'?`<span class="ico" aria-hidden="true">${t.ico}</span><span class="nm">${esc(t.n)}</span>`:`<span class="nm">${esc(t.n)}</span>`;
    h+=`<button class="${cls}" style="grid-row:${r};grid-column:${c}" data-i="${i}" aria-label="${esc(t.f)}">${label}${own}<span class="tokens">${toks}</span></button>`;

   <div class="turnbody"><div class="where">현재 위치 <b>${esc(t.f)}</b></div>${msg?`<p class="msg">${esc(msg)}</p>`:''}${body}${hold?`<div class="hold">${hold}</div>`:''}</div>`;
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on('#bRoll',rollApp);on('#bRest',()=>{restOver()});on('#bEsc',useEscape);
  on('#bBuy',actBuy);on('#bBuild',actBuild);on('#bSkip',actSkip);on('#bToll',()=>actToll(false));on('#bHalf',()=>actToll(true));on('#bFree',actFree);
  on('#bQuiz',()=>actQuizTile(0,true));on('#bKey',drawKey);on('#bNext',endTurn);on('#bBank',()=>confirmBox('파산 선언',`${p.name} 님의 거점이 모두 빈 땅이 되고 게임에서 빠져요.`,bankrupt));
  on('#bManual',()=>{if(!busy)doRoll(S.pick.slice(0,S.dice))});
  document.querySelectorAll('[data-guard]').forEach(b=>b.onclick=()=>{const k=+b.dataset.guard;S.own[k].level++;
    log(`<b>${esc(p.name)}</b> 의용수비대 특혜로 ${esc(T[k].f)}에 ${LV_NAME[S.own[k].level]} 무료 건설`);
    S.phase='done';S.msg=`${T[k].f}에 ${LV_NAME[S.own[k].level]}을(를) 무료로 지었어요! 통행료는 이제 ${fmt(tollOf(k))}예요.`;render()});
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellProp(+b.dataset.sell));
  document.querySelectorAll('.pick6 button').forEach(b=>b.onclick=()=>{S.pick[+b.dataset.d]=+b.dataset.v;renderTurn()});
  const seg=$('#modeSeg');if(seg)seg.onclick=e=>{const b=e.target.closest('button');if(b){S.mode=b.dataset.m;renderTurn();save()}};
}
function renderPlayers(){
  $('#players').innerHTML=S.players.map((p,k)=>{
    const props=Object.keys(S.own).filter(i=>S.own[i].owner===k).map(Number).sort((a,b)=>a-b)
      .map(i=>`<span class="prop g-${groupOf(i)}">${esc(T[i].n)} <span class="lv">${'★'.repeat(S.own[i].level)}</span></span>`).join('');
    const st=[p.out?'파산':'',p.island?`무인도(${p.island})`:'',p.heli?'헬기 대기':'',p.rest?'파견 근무':'',p.half?`할인권 ${p.half}장`:''].filter(Boolean).join(' · ');
    return `<div class="pl ${k===S.cur?'cur':''} ${p.out?'out':''}" style="--pc:${p.color}">
      <div class="pl-top"><b>${k+1}. ${esc(p.name)}</b><span class="dp ${p.dp<0?'neg':''}">${fmt(p.dp)}</span></div>
      <div class="status">${esc(T[p.pos].f)}${st?' · '+st:''}</div>
      ${props?`<div class="props">${props}</div>`:''}</div>`}).join('');
}
function renderTools(){
  const opts=S.players.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');
  $('#toolBody').innerHTML=`
   <div class="trow"><label for="tg">출발지 통과 지원금 (실물 판으로 진행할 때)</label><select id="tg">${opts}</select><button class="sbtn" id="tgo">+200,000 DP</button></div>
   <div class="trow"><label>DP 보내기 (통행료 수동 정산 등)</label>
     <select id="tf" aria-label="보내는 쪽"><option value="bank">은행</option>${opts}</select>
     <select id="tt" aria-label="받는 쪽">${opts}<option value="bank">은행</option><option value="vault">성금함</option></select>
     <input type="number" id="ta" min="0" step="1000" value="10000" aria-label="금액"><button class="sbtn" id="tsend">보내기</button></div>
   <div class="trow"><label>말 위치 옮기기 (칸 효과 없음)</label><select id="tp">${opts}</select>
     <select id="tpos">${T.map((t,i)=>`<option value="${i}">${i}. ${esc(t.f)}</option>`).join('')}</select><button class="sbtn" id="tmove">옮기기</button></div>
   <div class="trow"><button class="sbtn" id="tend">게임 종료 · 최종 순위</button><button class="sbtn red" id="treset">새 게임</button></div>`;
  $('#tgo').onclick=()=>{const p=S.players[+$('#tg').value];gain(p,START_BONUS);log(`<b>${esc(p.name)}</b> 출발지 지원금 +200,000 DP (수동)`);toast(`${p.name} +200,000 DP`);render()};
  $('#tsend').onclick=()=>{const a=Math.max(0,+$('#ta').value||0),f=$('#tf').value,t=$('#tt').value;if(!a||f===t)return;
    const name=v=>v==='bank'?'은행':v==='vault'?'성금함':S.players[+v].name;
    if(f!=='bank')S.players[+f].dp-=a;
    if(t==='vault')S.vault+=a;else if(t!=='bank')S.players[+t].dp+=a;
    log(`${esc(name(f))} → ${esc(name(t))} ${fmt(a)} (수동)`);toast(`${name(f)} → ${name(t)} ${fmt(a)}`);render()};
  $('#tmove').onclick=()=>{const p=S.players[+$('#tp').value];p.pos=+$('#tpos').value;log(`<b>${esc(p.name)}</b> 말을 ${esc(T[p.pos].f)}(으)로 옮김 (수동)`);render()};
  $('#tend').onclick=()=>showRank(true);
  $('#treset').onclick=()=>confirmBox('새 게임','지금 게임 기록이 모두 지워져요. 새로 시작할까요?',showSetup);
}

/* ================= 시작 ================= */
$('#board').addEventListener('click',e=>{
  const b=e.target.closest('.tile');if(!b||busy)return;const i=+b.dataset.i,p=cp();
  if(S.phase==='roll'&&p.heli&&!p.rest)heliTo(i);else showTile(i);
});
$('#btnRules').onclick=showRules;
$('#btnPrice').onclick=showPrices;
$('#btnRank').onclick=()=>showRank(false);
$('#tools').addEventListener('toggle',()=>{if($('#tools').open)renderTools()});

S=load();if(S&&S.dice!==1)S.dice=1;if(S&&S.players)S.players.forEach(p=>{if(p.half==null)p.half=0});
if(S&&S.players){render();if(S.phase==='roll'&&busy===false){}}
else{newGame(['플레이어 1','플레이어 2','플레이어 3','플레이어 4']);showSetup()}
</script>
